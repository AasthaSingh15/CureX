spring:
  datasource:
    # Paste the JDBC string obtained from Supabase Dashboard > Connect.
    url: jdbc:postgresql://https://xmzauolgszdwlicpvvro.supabase.co
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
leave:
  policy:
    annual-entitlement: 20
    team-absence-warning-threshold: 20
    count-weekends: false
  approval:
    manager-timeout-hours: 24
    hr-timeout-hours: 24
demo:
  escalation-enabled: true
  escalation-check-interval-ms: 60000
